<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Applied before first paint to avoid a theme flash. Dark is the default brand experience.
      try {
        var stored = window.localStorage.getItem('pixelsync-theme')
        document.documentElement.dataset.theme = stored === 'light' ? 'light' : 'dark'
      } catch (_) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PixelSync Studio — Web Design, UI/UX &amp; Full-Stack Development Studio</title>

      name="description"

    />

    <!-- Production URL: https://pixelsyncstudio.vercel.app — when a custom domain is live, swap it for that one domain here, in public/robots.txt and public/sitemap.xml. -->
    <link rel="canonical" href="https://pixelsyncstudio.vercel.app/" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0B0D0F" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F5F6F8" />
